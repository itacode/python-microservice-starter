[project]
name = "python-microservice-starter"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "connexion[flask,swagger-ui,uvicorn]>=3.2.0",
  "python-dotenv>=1.1.1",
  "flask-cors>=6.0.1",
  "flask-compress>=1.17",
  "pymysql>=1.1.1",
  "cryptography>=46.0.1",
  "pandas>=3.0.0",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "sqlalchemy>=2.0.41",
]

[project.scripts]
dev = "app.dev_server:start"

[dependency-groups]
dev = [
    "pytest>=9.0.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120

[tool.pytest]
addopts = ["-v", "-s"]
